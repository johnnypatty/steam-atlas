name: Desktop build

on:
  workflow_dispatch:
  push:
    branches: [main, agent/beta-0.2, agent/v1-game-workspaces]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  windows:
    name: Windows x64
    needs: web
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows application
        run: npm run desktop:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: steam-atlas-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/steam-atlas.exe
            src-tauri/target/release/bundle/nsis/*

  linux:
    name: Linux x64
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Generate Rust lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint native core
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test native core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Upload generated Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: steam-atlas-cargo-lock
          path: src-tauri/Cargo.lock
      - name: Build Linux application
        run: npm run desktop:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: steam-atlas-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/steam-atlas
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
