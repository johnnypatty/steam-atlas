[package]
name = "steam-atlas"
version = "0.2.0-beta.1"
description = "A local-first Steam control center"
authors = ["Steam Atlas contributors"]
edition = "2021"

[lib]
name = "steam_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
scraper = "0.23"
rfd = "0.15"
dirs = "6"
urlencoding = "2"
open = "5"
base64 = "0.22"
keyring = "=4.1.5"
url = "2"
sha2 = "0.10"
