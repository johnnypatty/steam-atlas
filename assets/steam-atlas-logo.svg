<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Steam Atlas — Atlas Node</title>
  <desc id="desc">An angular letter A mapped by two orbital paths and connected navigation nodes.</desc>
  <defs>
    <radialGradient id="bg" cx="32%" cy="24%" r="90%">
      <stop offset="0" stop-color="#173143"/>
      <stop offset=".55" stop-color="#0a1119"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="signal" x1="180" y1="140" x2="810" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9fbff"/>
      <stop offset=".42" stop-color="#66e3ff"/>
      <stop offset="1" stop-color="#6f83ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="216" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="350" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="2"/>
  <g fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M129 539C263 367 699 252 855 414c155 161-189 431-482 348C101 685 57 429 247 233" stroke-width="27" opacity=".56"/>
    <path d="M297 790C255 540 423 170 639 176c229 7 270 394 85 626" stroke-width="24" opacity=".72"/>
    <path d="M306 759 506 205l209 554M383 571h255" stroke-width="54"/>
  </g>
  <circle cx="247" cy="233" r="43" fill="#d9fbff" filter="url(#glow)"/>
  <circle cx="512" cy="571" r="48" fill="#66e3ff" filter="url(#glow)"/>
  <circle cx="512" cy="571" r="18" fill="#081018"/>
</svg>
